<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Read the original Beyond Relics comic pages in a full-screen, zoomable reader.">
<title>Comic Reader — Beyond Relics</title>
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="css/comics-experience.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" defer></script>
<script src="js/comic-reader.js" defer></script>
<script src="js/comic-world-3d.js" defer></script>

<link rel="stylesheet" href="css/motion-system.css">
<script src="js/motion-system.js" defer></script>
<link rel="stylesheet" href="css/mission-universe.css">
</head>
<body class="reader-page">
<header class="reader-top">
<div class="reader-back"><a href="index.html" aria-label="Back to comic collection">← Collection</a><div class="reader-title"><strong id="reader-title">Loading comic…</strong><span id="reader-subtitle"></span></div></div>
<div class="reader-tools">
<button class="reader-tool" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
<button class="reader-tool" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
<button class="reader-tool" data-action="reset" aria-label="Reset zoom" title="Reset zoom">↺</button>
<button class="reader-tool" data-action="fullscreen" aria-label="Enter full screen" title="Full screen">⛶</button>
</div>
</header>
<main class="reader-stage" id="reader-stage">
<button class="reader-arrow prev" id="reader-prev" aria-label="Previous page">‹</button>
<div class="reader-image-wrap" id="reader-image-wrap"><img class="reader-image" id="reader-image" alt="" draggable="false"></div>
<div class="reader-caption" id="reader-caption" hidden></div><div class="cinema-controls" aria-label="Cinema controls"><button id="cinema-toggle" type="button" aria-label="Pause film">Ⅱ</button><button id="cinema-next" type="button">NEXT ↗</button><button id="cinema-sound" type="button">♫ SOUND</button></div>
<button class="reader-arrow next" id="reader-next" aria-label="Next page">›</button>
</main>
<footer class="reader-bottom">
<div class="reader-thumbs" id="reader-thumbs" aria-label="Comic pages"></div>
<div class="reader-counter" id="reader-counter"><strong>1</strong> / 1</div>
<a class="footer-credits" href="credits.html">Credits &amp; methodology ↗</a></footer>
<script src="js/mission-universe.js" defer></script>
</body>
</html>
