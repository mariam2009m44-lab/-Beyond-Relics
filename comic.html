<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Read the original Beyond Relics comic pages in a full-screen, zoomable reader.">
<title>Comic Reader — Beyond Relics</title>
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="css/comics-experience.css">
<script src="js/comic-reader.js" defer></script>

<link rel="stylesheet" href="css/motion-system.css">
<script src="js/motion-system.js" defer></script>
</head>
<body class="reader-page">
<header class="reader-top">
<div class="reader-back"><a href="index.html" aria-label="Back to comic collection">← Collection</a><div class="reader-title"><strong id="reader-title">Loading comic…</strong><span id="reader-subtitle"></span></div></div>
<div class="reader-tools">
<button class="reader-tool" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
<button class="reader-tool" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
<button class="reader-tool" data-action="reset" aria-label="Reset zoom" title="Reset zoom">↺</button>
<button class="reader-tool" data-action="fullscreen" aria-label="Enter full screen" title="Full screen">⛶</button>
</div>
</header>
<section class="motion-console" aria-label="Cinematic comic controls">
  <div class="motion-console-main">
    <button class="motion-play" id="motion-play" type="button">▶ Play Full Story</button>
    <button class="motion-control" id="motion-pause" type="button" disabled>Ⅱ Pause</button>
    <button class="motion-control" id="motion-stop" type="button" disabled>■ Stop</button>
  </div>
  <div class="motion-console-options">
    <label for="motion-speed">Playback speed</label>
    <select id="motion-speed">
      <option value="0.7">Slow</option><option value="1" selected>Normal</option><option value="1.45">Fast</option>
    </select>
    <label for="motion-preset">Camera move</label>
    <select id="motion-preset">
      <option value="pan-right">Pan Right</option><option value="pan-left">Pan Left</option>
      <option value="pan-down">Pan Down</option><option value="zoom-in">Zoom In</option>
      <option value="zoom-out">Zoom Out</option><option value="impact">Impact Zoom</option>
    </select>
    <button class="motion-control" id="motion-apply" type="button">Apply Move</button>
  </div>
  <div class="motion-progress" aria-hidden="true"><span id="motion-progress-fill"></span></div>
</section>
<main class="reader-stage" id="reader-stage">
<button class="reader-arrow prev" id="reader-prev" aria-label="Previous page">‹</button>
<div class="reader-image-wrap" id="reader-image-wrap"><img class="reader-image" id="reader-image" alt="" draggable="false"><div class="reader-help" id="reader-help">TAP IMAGE TO ZOOM · SWIPE TO TURN PAGE</div></div>
<div class="reader-caption" id="reader-caption" hidden></div>
<button class="reader-arrow next" id="reader-next" aria-label="Next page">›</button>
</main>
<footer class="reader-bottom">
<div class="reader-thumbs" id="reader-thumbs" aria-label="Comic pages"></div>
<div class="reader-counter" id="reader-counter"><strong>1</strong> / 1</div>
</footer>
</body>
</html>
